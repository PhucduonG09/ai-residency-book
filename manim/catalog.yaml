    desc: Sáu đoạn 20, 25, 45, 45, 25, 20 giây; 47, 58, 105, 105, 58, 47 từ; tổng 180 giây và 420 từ ở 140 từ/phút.
  - cls: NhipNoiWPM
    section: '13.5'
