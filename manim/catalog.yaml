    desc: Mẫu 306 từ sáu đoạn; đoạn mở 34 từ, ba đoạn việc đã làm 157 từ, bước tiếp theo 56 từ; đoạn lạc đề 59 từ bị bỏ, còn 247 từ.
  - cls: LichNguocThu
    section: '13.4'
    title: Lịch ngược cho thư giới thiệu
    desc: Hạn giả định 12/11/2027; hỏi người viết ngày 15/07, gửi gói tài liệu 17/09, nhắc 22/10 và 05/11.
