chuong14:
  file: chuong14_scenes.py
  scenes:
  - cls: DongHo12Phut
    section: '14.1'
    title: Một chuỗi 4 tầng trong 12 phút
    desc: Mỗi tầng 3 phút gồm 2 phút trả lời (khoảng 280 từ ở 140 từ/phút) và 1 phút hỏi lại. Khung luyện của sách, không phải định dạng của chương trình nào.
  - cls: LichLeitner
    section: '14.1'
    title: Lịch ôn Leitner cho 18 chuỗi
    desc: Lab 2, 28 ngày, hộp 1-3-7-14 ngày; tổng 69 lượt, ngày 12 và 17 nặng nhất với 6 chuỗi (72 phút nói).
  - cls: BoDePhuongSai
    section: '14.2'
    title: Một bổ đề phương sai, ba chỗ dùng
    desc: Var(Σ wᵢxᵢ) = n·Var(w)·E[x²] cho khởi tạo He (1.995 → 1.808 qua 10 lớp ở một seed; 20 seed cho 1.35–3.21), 1/n còn 0.0017, chia √dₖ (std 7.99 → 0.999) và dòng residual (25.13 so với 2.000).
  - cls: NganSachBoNho
    section: '14.3'
    title: Ngân sách bộ nhớ khi phục vụ mô hình 7B
    desc: GPU giả định 80 GiB chứa 33 chuỗi 4096 token với MHA hoặc 134 với 8 đầu K/V; laptop 6 GiB cần 5.33 GiB cho 4-bit và KV 4096 token, chưa tính overhead.
  - cls: CayChuoiNoiChuong
    section: '14.3'
    title: Từ một logit tới một token được phục vụ
    desc: Chuỗi capstone P1 qua chương 2, 8, 9; mỗi nút một con số đã kiểm (p − y, entropy theo nhiệt độ, 0.5 MiB mỗi token, 3.36 token mỗi lượt).
  - cls: TokenNhapHinhHoc
    section: '14.4'
    title: Speculative decoding, token kỳ vọng mỗi lượt
    desc: α = 0.8, k = 4; tổng 1 + 0.8 + 0.64 + 0.512 + 0.4096 = 3.3616 (mô phỏng 3.3511), với giả định chấp nhận độc lập.
  - cls: NganSachSTAR
    section: '14.5'
    title: Ngân sách giây cho một câu chuyện STAR
    desc: Gợi ý MIT CAPD 20/10/60/10 cho 2 phút (24, 12, 72, 12 giây) so với câu chuyện mẫu 206 từ, 88 giây ở 140 từ/phút (15/11/56/18%, nhãn của sách không đếm); thanh vẽ theo số giây thật, còn dư 32 giây.
