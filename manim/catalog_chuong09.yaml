    desc: Ví dụ 9.11; absmax int8 sai số 0.0016, thêm ngoại lệ 12.0 thì 0.0445, lượng tử theo khối thì khối chứa ngoại lệ vẫn sai 0.0276 còn khối kia, mã (16, 127, −95, 64), sai 0.0016.
