chuong05:
  file: chuong05_scenes.py
  scenes:
    - {cls: LogisticTachDuoc, section: "5.1", title: "Logistic trên dữ liệu tách được", desc: "x = 1..4, y = (0, 0, 1, 1): không L2 thì w tăng 1.716 → 10.312 (‖w‖ → ∞), sigmoid thành bậc thang, ranh giới −b/w tăng chậm 2.307 → 2.483 và tiến về 2.5 (implicit bias, hướng (w, b) hội tụ rất chậm về nghiệm lề cực đại); L2 λ = 0.1 dừng ở w = 1.508, ranh giới 2.5."}
    - {cls: BiasVarianceDaThuc, section: "5.2", title: "Bias–variance với đa thức", desc: "Vẽ 20 trong 2000 lần lấy lại nhãn nhiễu (số liệu tính từ cả 2000 lần), bậc 1, 3, 9: bias² 0.1809 / 0.0054 / 0.0000, variance 0.0078 / 0.0136 / 0.0380."}
    - {cls: L1L2HinhHoc, section: "5.2", title: "Vì sao L1 thưa", desc: "Đồng mức chạm hình tròn ở điểm có hai tọa độ khác 0, chạm hình thoi ở đỉnh; soft-threshold z = (3, 0.8, −2) → (2, 0, −1)."}
    - {cls: NguongVaPrecision, section: "5.2", title: "Ngưỡng, ROC và precision", desc: "Trượt ngưỡng trên hai phân phối điểm, theo dõi điểm tương ứng trên đường ROC (cảnh chỉ vẽ ROC, không vẽ đường PR); bảng số bên phải cho thấy tại TPR 0.9, FPR 0.05 precision là 0.947 / 0.667 / 0.154 khi lớp dương chiếm 50% / 10% / 1%."}
    - {cls: HamMatMatSoSanh, section: "5.3", title: "0-1, hinge và log-loss", desc: "Ba hàm mất mát trên trục margin; hai điểm của ví dụ 5.8 có hinge 0.5 và 2."}
    - {cls: BoostingPhanDu, section: "5.4", title: "Gradient boosting khớp phần dư", desc: "6 điểm, stump chia ở 3.5, η = 0.5: MSE 0.2447 → 0.0695 → 0.0257."}
    - {cls: KMeansVaEM, section: "5.5", title: "k-means kẹt và một vòng EM", desc: "Hai khởi tạo cho J = 196 và 77.5; EM trên (0, 1, 2.5, 4, 5): γ = 0.5 cho điểm giữa, μ → (0.901, 4.099)."}
