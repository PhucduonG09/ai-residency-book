# Môi trường conda cho Sổ tay Residency. Tạo bằng setup.bat (hoặc: conda env create -f environment.yml)
name: residency-book
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - matplotlib
  - scikit-image
  - jupyterlab
  - ipykernel
  - nbformat
  - pyyaml
  - streamlit
  - manim
  - ffmpeg
  - pip
  - pip:
      # PyTorch bản CPU cho lab chương 6–12 (bản CPU là đủ, xem đầu lab chương 6).
      # --index-url chỉ áp dụng cho các gói pip ở mục này, các gói conda ở trên không bị ảnh hưởng.
      # Muốn dùng GPU: lấy lệnh cài bản CUDA hợp với card ở pytorch.org rồi cài đè trong môi trường này.
      - --index-url https://download.pytorch.org/whl/cpu
      - torch
